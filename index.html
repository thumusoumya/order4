<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>📦 Your parcel is out for delivery</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Great+Vibes&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* =========================================================
   UNSAID — "Out for Delivery" · a parcel from a brother
   ========================================================= */
:root{--amber:#ffb23f;--amber2:#ff8a1f;--ink:#0d1b2a;--card:#14263a;--line:#24405e;--cream:#fff6ea;--green:#3ddc97}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{-webkit-user-select:none;user-select:none;background:#000;display:flex;justify-content:center;overflow:hidden;font-family:Montserrat,sans-serif;color:var(--cream)}
.app{position:relative;width:100%;max-width:440px;height:100vh;height:100dvh;min-height:560px;overflow:hidden;overflow:clip;
  background:radial-gradient(90% 60% at 50% 20%,#1b3550 0%,#0d1b2a 60%,#060d15 100%)}
[hidden]{display:none!important}
#fx{position:absolute;inset:0;width:100%;height:100%;z-index:40;pointer-events:none}
.sc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px 18px;
  opacity:0;visibility:hidden;transition:opacity .8s ease,visibility 0s .8s;z-index:5}
.sc.on{opacity:1;visibility:visible;transition:opacity .8s ease}
.sc > *{flex-shrink:0}
.hint{font:700 10.5px Montserrat;letter-spacing:.28em;text-transform:uppercase;color:rgba(255,246,234,.75);animation:blink 1.7s infinite}
@keyframes blink{50%{opacity:.35}}
.hint.off{animation:none;opacity:0;transition:opacity .4s}
.fade{pointer-events:none;opacity:0;transform:translateY(10px);transition:opacity .9s,transform .9s}
.fade.on{opacity:1;transform:none}
.soft{font:italic 500 21px/1.42 'Cormorant Garamond',serif;max-width:320px}
.brand{display:inline-flex;align-items:center;gap:8px;font:800 12px Montserrat;letter-spacing:.2em}
.brand i{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:15px;background:linear-gradient(135deg,var(--amber),var(--amber2));color:#1a0e00}

/* ---------- 0. LOCK SCREEN NOTIFICATION ---------- */
#s-lock{justify-content:flex-start;padding-top:70px;cursor:pointer}
.clock{font:300 78px/1 Montserrat;letter-spacing:-2px}
.date{font:600 15px Montserrat;color:rgba(255,246,234,.75);margin-top:6px}
.noti{width:100%;max-width:350px;margin-top:60px;padding:14px 14px 16px;border-radius:22px;text-align:left;
  background:rgba(255,255,255,.12);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.14);
  box-shadow:0 20px 40px rgba(0,0,0,.4);animation:slide .9s cubic-bezier(.2,1.3,.4,1) .6s both}
@keyframes slide{from{transform:translateY(-140px);opacity:0}to{transform:none;opacity:1}}
.noti .top{display:flex;justify-content:space-between;align-items:center;font:600 11px Montserrat;color:rgba(255,246,234,.7)}
.noti h4{font:700 15px Montserrat;margin-top:10px}
.noti p{font:500 14px/1.4 Montserrat;color:rgba(255,246,234,.85);margin-top:4px}
.ping{position:relative;width:10px;height:10px;border-radius:50%;background:var(--amber);display:inline-block}
.ping:after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--amber);animation:pg 1.4s ease-out infinite}
@keyframes pg{to{transform:scale(3);opacity:0}}
.lk-hint{margin-top:26px}

/* ---------- 1. LIVE TRACKING ---------- */
#s-track{justify-content:flex-start;padding-top:22px}
.bar{width:100%;max-width:360px;display:flex;justify-content:space-between;align-items:center}
.ord{font:600 11px Montserrat;color:rgba(255,246,234,.6);letter-spacing:.1em}
.status{width:100%;max-width:360px;margin-top:14px;padding:14px 16px;border-radius:18px;background:var(--card);border:1px solid var(--line);text-align:left}
.status small{font:700 10px Montserrat;letter-spacing:.25em;color:var(--amber)}
.status h3{font:700 19px/1.25 Montserrat;margin-top:4px}
.eta{font:600 12px Montserrat;color:rgba(255,246,234,.65);margin-top:4px}
.steps{display:flex;gap:6px;margin-top:12px}
.steps i{flex:1;height:5px;border-radius:3px;background:var(--line);overflow:hidden;position:relative}
.steps i.done{background:var(--green)}
.steps i.now:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,var(--amber),transparent);animation:load 1.2s linear infinite}
@keyframes load{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.steps-l{display:flex;justify-content:space-between;margin-top:6px;font:600 9px Montserrat;color:rgba(255,246,234,.55);letter-spacing:.05em}
.map{position:relative;width:100%;max-width:360px;height:360px;margin-top:12px;border-radius:20px;overflow:hidden;border:1px solid var(--line);
  background:
   linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px) 0 0/30px 30px,
   linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px) 0 0/30px 30px,
   radial-gradient(60% 50% at 30% 30%,#1a3a3a,transparent),radial-gradient(50% 40% at 80% 70%,#1d2f4f,transparent),#0f2133}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.truck{position:absolute;width:44px;height:44px;margin:-22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;z-index:3;
  background:linear-gradient(135deg,var(--amber),var(--amber2));box-shadow:0 0 0 6px rgba(255,178,63,.25),0 8px 18px rgba(0,0,0,.5)}
.pin{position:absolute;width:30px;height:30px;margin:-30px 0 0 -15px;z-index:2;font-size:24px;line-height:30px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.5));transition:transform .4s}
.pin.hit{transform:scale(1.3)}
.stop{position:absolute;left:50%;top:50%;width:240px;margin-left:-120px;z-index:6;background:#fff;color:#1a2433;border-radius:16px;padding:10px 10px 14px;
  box-shadow:0 24px 50px rgba(0,0,0,.6);transform:translateY(-50%) scale(.5);opacity:0;pointer-events:none;transition:all .6s cubic-bezier(.2,1.5,.4,1)}
.stop.on{transform:translateY(-50%);opacity:1}
.stop img{display:block;width:100%;height:200px;object-fit:cover;border-radius:10px;background:#dfe6ee}
.stop small{display:block;margin-top:10px;font:800 10px Montserrat;letter-spacing:.22em;color:var(--amber2)}
.stop p{font:italic 600 19px/1.3 'Cormorant Garamond',serif;margin-top:3px}
.driver{width:100%;max-width:360px;margin-top:12px;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--card);border:1px solid var(--line);text-align:left}
.driver .av{width:40px;height:40px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:20px;background:#22405f}
.driver b{display:block;font:700 13px Montserrat}
.driver span{font:500 12px Montserrat;color:rgba(255,246,234,.6)}
.driver .call{margin-left:auto;font-size:18px;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(61,220,151,.15)}

/* ---------- 2. DOORBELL ---------- */
.dr-k,.dr-t{transition:opacity .4s}
.dr-k{font:700 11px Montserrat;letter-spacing:.3em;color:var(--amber)}
.dr-t{font:600 34px/1.15 'Cormorant Garamond',serif;font-style:italic;margin-top:6px}
.doorway{position:relative;width:220px;height:300px;margin:26px 0 18px;perspective:800px}
.frame{position:absolute;inset:0;border-radius:110px 110px 6px 6px;background:radial-gradient(70% 60% at 50% 60%,#ffe2a8,#ffb23f 50%,#c46a10);box-shadow:inset 0 0 40px rgba(0,0,0,.25),0 0 50px rgba(255,178,63,.35)}
.parcel-peek{position:absolute;left:50%;bottom:20px;font-size:64px;margin-left:-32px;opacity:0;transition:opacity .6s .6s}
.door{position:absolute;inset:0;border-radius:110px 110px 6px 6px;background:linear-gradient(90deg,#5a3216,#7b4620 50%,#5a3216);transform-origin:0 50%;transition:transform 1.4s cubic-bezier(.6,0,.3,1);box-shadow:inset 0 0 0 10px #4a2810}
.door:before{content:"";position:absolute;left:30px;right:30px;top:40px;height:100px;border-radius:70px 70px 6px 6px;border:4px solid #4a2810}
.door:after{content:"";position:absolute;right:26px;top:160px;width:12px;height:12px;border-radius:50%;background:#ffd27a;box-shadow:0 0 8px #ffd27a}
.door .wreath{position:absolute;left:50%;top:58px;width:70px;height:70px;margin-left:-35px;border-radius:50%;border:10px solid #2e7d32;box-shadow:inset 0 0 0 2px #1b5e20}
.door .wreath:after{content:"🎀";position:absolute;left:50%;bottom:-16px;margin-left:-11px;font-size:20px}
.doorway.open .door{transform:rotateY(-105deg)}
.doorway.open .parcel-peek{opacity:1}
.bell{width:76px;height:76px;border-radius:50%;border:0;cursor:pointer;font-size:32px;background:radial-gradient(circle at 35% 30%,#fff3c4,#ffb23f 60%,#c46a10);box-shadow:0 0 0 6px rgba(255,178,63,.25),0 10px 24px rgba(0,0,0,.5);animation:ring 1.6s ease-in-out infinite}
@keyframes ring{0%,60%,100%{transform:none}70%{transform:rotate(-14deg)}80%{transform:rotate(12deg)}90%{transform:rotate(-8deg)}}
.bell.pressed{animation:none;transform:scale(.9);opacity:.5}
.ding{position:absolute;top:13%;left:0;right:0;font:800 30px Montserrat;color:var(--amber);opacity:0;transform:scale(.5);transition:all .5s cubic-bezier(.2,1.6,.4,1)}
.ding.on{opacity:1;transform:none}

/* ---------- 3. OPEN THE BOX ---------- */
.bx-k{font:700 11px Montserrat;letter-spacing:.3em;color:var(--amber)}
.bx-t{font:600 34px/1.15 'Cormorant Garamond',serif;font-style:italic;margin-top:6px}
.box{position:relative;width:250px;height:230px;margin:40px 0 16px;cursor:pointer}
.box .body{position:absolute;left:0;right:0;bottom:0;height:160px;border-radius:6px;background:linear-gradient(90deg,#b07a42,#d6a066 50%,#b07a42);box-shadow:0 20px 40px rgba(0,0,0,.6)}
.box .body .lbl{position:absolute;left:10px;bottom:16px;width:86px;padding:6px;background:#fff;color:#222;border-radius:4px;text-align:left;font:700 8px/1.4 Montserrat;letter-spacing:.06em;transform:rotate(-3deg)}
.box .body .lbl b{display:block;font:800 10px Montserrat;color:var(--amber2)}
.box .body .frag{position:absolute;right:8px;top:18px;padding:3px 6px;border:2px solid #b3233a;color:#b3233a;font:800 7.5px Montserrat;letter-spacing:.08em;transform:rotate(6deg)}
.flap{position:absolute;top:70px;width:50%;height:30px;background:linear-gradient(#c8925a,#b07a42);transition:transform 1s cubic-bezier(.3,1.4,.5,1);z-index:2}
.flap.l{left:0;transform-origin:0 100%;border-radius:4px 0 0 0}
.flap.r{right:0;transform-origin:100% 100%;border-radius:0 4px 0 0}
.tape{position:absolute;left:50%;top:62px;width:46px;height:120px;margin-left:-23px;z-index:3;background:linear-gradient(90deg,#e8d39a,#f6e7b8,#e8d39a);opacity:.95;transition:opacity .5s, transform .6s}
.tape:after{content:"♥ UNSAID ♥";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(90deg);white-space:nowrap;font:800 9px Montserrat;letter-spacing:.2em;color:#9a7428}
.box.open .tape{opacity:0;transform:translateY(-30px)}
.box.open .flap.l{transform:rotate(-125deg)}
.box.open .flap.r{transform:rotate(125deg)}
.glow{position:absolute;left:50%;top:80px;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:#fff3c8;opacity:0}
.box.open .glow{animation:rays 1.6s ease-out forwards}
@keyframes rays{0%{opacity:1;box-shadow:0 0 0 0 rgba(255,231,166,.9)}100%{opacity:0;box-shadow:0 0 120px 160px rgba(255,231,166,0)}}
.hamper{position:absolute;left:50%;top:50%;width:300px;margin-left:-150px;z-index:10;padding:22px 16px;border-radius:18px;text-align:center;
  background:linear-gradient(160deg,#fff8ec,#f7e3c4);color:#2a1a10;box-shadow:0 0 0 3px var(--amber),0 24px 50px rgba(0,0,0,.6);
  transform:translateY(-50%) scale(.5);opacity:0;pointer-events:none;transition:all .8s cubic-bezier(.2,1.5,.4,1)}
.hamper.on{transform:translateY(-50%);opacity:1}
.hamper small{display:inline-block;padding:6px 14px;border:1px solid #c98a00;font:800 10px Montserrat;letter-spacing:.35em}
.hamper .em{font-size:50px;margin:12px 0}
.hamper h3{font:italic 600 27px 'Cormorant Garamond',serif;color:#b3561a}
.hamper p{font:500 18px/1.4 'Cormorant Garamond',serif;margin-top:6px}

/* ---------- 4. DELIVERY RECEIPT ---------- */
#s-final{justify-content:flex-start;padding:30px 16px 30px;overflow-y:auto;overflow-x:hidden}
.done{display:flex;flex-direction:column;align-items:center}
.tick{width:66px;height:66px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;font-size:34px;color:#06281a;box-shadow:0 0 0 10px rgba(61,220,151,.18);animation:pop .7s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(0)}}
.done h2{font:800 22px Montserrat;margin-top:14px}
.done span{font:600 12px Montserrat;color:rgba(255,246,234,.6);margin-top:4px}
.receipt{position:relative;width:100%;max-width:350px;margin-top:20px;padding:24px 22px 30px;background:#fffdf8;color:#1f2633;text-align:left;
  -webkit-mask:linear-gradient(#000 0 0) top/100% calc(100% - 10px) no-repeat,radial-gradient(circle 7px at 10px 100%,#0000 98%,#000) bottom/20px 10px repeat-x;
  transform:translateY(60px);opacity:0;transition:all 1s cubic-bezier(.2,1.2,.4,1) .3s}
.sc.on .receipt{transform:none;opacity:1}
.rc-h{display:flex;justify-content:space-between;font:700 10px Montserrat;letter-spacing:.15em;color:#7a8597;border-bottom:1px dashed #c9cfd8;padding-bottom:10px}
.rc-row{display:flex;justify-content:space-between;font:600 13px Montserrat;padding:7px 0}
.rc-row b{font-weight:700;text-align:right;max-width:60%}
.rc-photos{display:flex;gap:6px;margin:10px 0;justify-content:center}
.rc-photos img{width:31%;height:92px;object-fit:cover;border-radius:6px;background:#dfe6ee}
.note{border-top:1px dashed #c9cfd8;margin-top:8px;padding-top:12px}
.note p{font:500 18px/1.45 'Cormorant Garamond',serif;margin-bottom:8px;opacity:0;transform:translateY(6px);transition:all .8s}
.note p:first-child{font-style:italic;font-weight:600}
.note p.s{opacity:1;transform:none}
.sign{font:38px 'Great Vibes',cursive;color:#b3561a;text-align:right;opacity:0;transition:opacity 1s}
.sign.s{opacity:1}
.rate{margin-top:14px;text-align:center;border-top:1px dashed #c9cfd8;padding-top:12px}
.rate small{font:700 10px Montserrat;letter-spacing:.2em;color:#7a8597}
.stars{display:flex;justify-content:center;gap:6px;margin-top:8px}
.stars b{font-size:30px;cursor:pointer;filter:grayscale(1) opacity(.4);transition:filter .3s,transform .3s}
.stars b.on{filter:none;transform:scale(1.15)}
.rate p{font:italic 600 18px 'Cormorant Garamond',serif;margin-top:6px;min-height:24px;color:#b3561a}
.again{margin:22px 0 10px;background:none;border:1px solid var(--amber);color:var(--amber);font:700 11px Montserrat;letter-spacing:.3em;padding:12px 22px;border-radius:30px;cursor:pointer}

@media (max-height:740px){
  #s-lock{padding-top:40px}.clock{font-size:64px}.noti{margin-top:36px}
  .map{height:300px}.status{padding:10px 14px}.status h3{font-size:16px}.driver{display:none}
  .stop img{height:150px}
  .doorway{transform:scale(.82);margin:6px 0 0}
  .box{transform:scale(.85);margin:20px 0 6px}
}
</style>
</head>
<body>
<div class="app" id="app">
  <canvas id="fx"></canvas>

  <!-- 0. LOCK SCREEN -->
  <section class="sc on" id="s-lock">
    <div class="clock" id="clock">9:41</div>
    <div class="date" id="date"></div>
    <div class="noti">
      <div class="top"><span class="brand"><i>📦</i><span id="brandN"></span></span><span>now <span class="ping"></span></span></div>
      <h4 id="ntH"></h4>
      <p id="ntP"></p>
    </div>
    <div class="hint lk-hint" id="lkHint"></div>
  </section>

  <!-- 1. LIVE TRACKING -->
  <section class="sc" id="s-track">
    <div class="bar"><span class="brand"><i>📦</i><span id="brandN2"></span></span><span class="ord" id="ord"></span></div>
    <div class="status">
      <small id="stK">● LIVE TRACKING</small>
      <h3 id="stH"></h3>
      <div class="eta" id="eta"></div>
      <div class="steps" id="steps"><i></i><i></i><i></i><i></i></div>
      <div class="steps-l" id="stepsL"></div>
    </div>
    <div class="map" id="map">
      <svg viewBox="0 0 360 360" preserveAspectRatio="none" id="mapSvg">
        <path d="M0 120 Q120 140 180 90 T360 70" stroke="#1e3a56" stroke-width="16" fill="none"/>
        <path d="M60 360 Q90 230 40 160" stroke="#1e3a56" stroke-width="14" fill="none"/>
        <path id="route" d="M40 330 C 110 320 70 250 140 240 S 280 250 260 180 S 120 140 170 90 S 300 70 320 40" stroke="rgba(255,178,63,.25)" stroke-width="10" fill="none" stroke-linecap="round"/>
        <path id="done" d="M40 330 C 110 320 70 250 140 240 S 280 250 260 180 S 120 140 170 90 S 300 70 320 40" stroke="#ffb23f" stroke-width="5" fill="none" stroke-linecap="round" stroke-dasharray="6 8"/>
      </svg>
      <div class="truck" id="truck">🚚</div>
      <div class="stop" id="stop"><img id="stopImg" alt=""><small id="stopN"></small><p id="stopP"></p></div>
    </div>
    <div class="driver"><div class="av">🧑</div><div><b id="drN"></b><span id="drS"></span></div><div class="call">📞</div></div>
  </section>

  <!-- 2. DOORBELL -->
  <section class="sc" id="s-door">
    <div class="dr-k" id="drK"></div>
    <div class="dr-t" id="drT"></div>
    <div class="ding" id="ding">DING DONG! 🔔</div>
    <div class="doorway" id="doorway"><div class="frame"></div><div class="parcel-peek">📦</div><div class="door"><div class="wreath"></div></div></div>
    <button class="bell" id="bell">🔔</button>
    <div class="hint" id="drHint" style="margin-top:14px"></div>
  </section>

  <!-- 3. OPEN THE BOX -->
  <section class="sc" id="s-box">
    <div class="bx-k" id="bxK"></div>
    <div class="bx-t" id="bxT"></div>
    <div class="box" id="box">
      <div class="glow"></div>
      <div class="flap l"></div><div class="flap r"></div><div class="tape"></div>
      <div class="body"><div class="lbl"><b>UNSAID EXPRESS</b><span id="lblTo"></span><br><span id="lblFrom"></span></div><div class="frag">HANDLE WITH LOVE</div></div>
    </div>
    <div class="hint" id="bxHint"></div>
    <div class="hamper" id="hamper"><small>UNSAID ♥</small><div class="em">🎀 💝 🎁</div><h3 id="hmT"></h3><p id="hmP"></p></div>
  </section>

  <!-- 4. DELIVERED + RECEIPT -->
  <section class="sc" id="s-final">
    <div class="done"><div class="tick">✓</div><h2 id="dnH"></h2><span id="dnS"></span></div>
    <div class="receipt">
      <div class="rc-h"><span>PROOF OF DELIVERY</span><span id="rcOrd"></span></div>
      <div id="rows"></div>
      <div class="rc-photos" id="rcPh"></div>
      <div class="note" id="note"></div>
      <div class="sign" id="sign"></div>
      <div class="rate"><small id="rtK"></small><div class="stars" id="stars"></div><p id="rtP"></p></div>
    </div>
    <button class="again" id="again" hidden>↺ TRACK IT AGAIN</button>
  </section>
</div>

<script>
/* =========================================================
   ✏️ EDIT EVERYTHING HERE
   ========================================================= */
const PARCEL = {
  song: "order4.mpeg",                                   // your song file
  photos: ["order4 image1", "order4 image3", "order4 image4"],   // exact file names (.jpeg / .jpg / .png auto)
  brand: "UNSAID EXPRESS",
  orderNo: "Order #BRO-0004",

  notiTitle: "Your parcel is out for delivery! 🚚",
  notiText: "A special package from your Brother is on its way to you. Tap to track it live.",
  lockHint: "Tap the notification",

  steps: ["Packed", "Shipped", "On the way", "Delivered"],
  trackTitle: "Out for delivery",
  eta: "Arriving in a few moments…",
  stopTitles: ["STOP 1 · MEMORY LANE", "STOP 2 · OUR BEST DAYS", "STOP 3 · FOREVER FAMILY"],
  stopLines: [                                           // one line per photo
    "Picking up all the good memories on the way…",
    "Adding the fights, the laughs & the best days…",
    "And packing it all with love — for you."
  ],
  arrivingTitle: "Arriving at your door",
  driverName: "Your Brother",
  driverText: "Personally delivering this one 😄",

  doorKick: "Your parcel has arrived",
  doorTitle: "Someone's at your door…",
  doorHint: "Ring the bell",

  boxKick: "Delivered with love",
  boxTitle: "Open your parcel",
  labelTo: "TO: The best sibling ever",
  labelFrom: "FROM: Your Brother ♥",
  boxHint: "Tap the box to cut the tape",
  hamperTitle: "Your UNSAID hamper",
  hamperText: "A little gift from your brother — packed with care, delivered with love.",

  doneTitle: "Delivered successfully",
  doneSub: "Received with a smile 😊",
  receipt: [["From", "Your Brother"], ["Contents", "1 gift + lots of love"], ["Packed with", "Memories & care"], ["Return policy", "No returns — you're stuck with me 😄"]],
  note: [
    "Hey,",
    "Brothers don't always say it out loud — so I sent it in a parcel instead.",
    "I'm proud of you, I'm always on your side, and no matter where life takes us, I'll always have your back.",
    "Hope this little surprise makes you smile today. ♡"
  ],
  sign: "— Your Brother",
  rateKick: "RATE YOUR DELIVERY PARTNER",
  rateLines: ["", "Only 1 star? I'm telling Mom! 😤", "2 stars? Rude! 😅", "3 stars… I'll take it 😏", "4 stars! Almost perfect 😄", "5 stars! Best brother ever, confirmed ⭐"]
};
/* ========================================================= */

const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const app = $("#app");
const wait = ms => new Promise(r => setTimeout(r, ms));
const at = el => { const a = app.getBoundingClientRect(), r = el.getBoundingClientRect(); return [r.left - a.left + r.width / 2, r.top - a.top + r.height / 2]; };
const txt = (id, t) => $(id).textContent = t;
const X = PARCEL;

/* ---------- build ---------- */
{ const d = new Date(); txt("#clock", d.getHours() % 12 || 12 ? `${d.getHours() % 12 || 12}:${String(d.getMinutes()).padStart(2, "0")}` : "9:41");
  txt("#date", d.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" })); }
txt("#brandN", X.brand); txt("#brandN2", X.brand); txt("#ntH", X.notiTitle); txt("#ntP", X.notiText); txt("#lkHint", X.lockHint);
txt("#ord", X.orderNo); txt("#stH", X.trackTitle); txt("#eta", X.eta); $("#stepsL").innerHTML = X.steps.map(s => `<span>${s}</span>`).join("");
txt("#drN", X.driverName); txt("#drS", X.driverText);
txt("#drK", X.doorKick); txt("#drT", X.doorTitle); txt("#drHint", X.doorHint);
txt("#bxK", X.boxKick); txt("#bxT", X.boxTitle); txt("#lblTo", X.labelTo); txt("#lblFrom", X.labelFrom); txt("#bxHint", X.boxHint); txt("#hmT", X.hamperTitle); txt("#hmP", X.hamperText);
txt("#dnH", X.doneTitle); txt("#dnS", X.doneSub); txt("#rcOrd", X.orderNo.replace("Order ", ""));
$("#rows").innerHTML = X.receipt.map(r => `<div class="rc-row"><span>${r[0]}</span><b>${r[1]}</b></div>`).join("");
$("#rcPh").innerHTML = X.photos.map((_, i) => `<img data-ph="${i}" alt="">`).join("");
$("#note").innerHTML = X.note.map(p => `<p>${p}</p>`).join(""); txt("#sign", X.sign); txt("#rtK", X.rateKick);
$("#stars").innerHTML = [1, 2, 3, 4, 5].map(n => `<b data-n="${n}">⭐</b>`).join("");

/* ---------- photos ---------- */
const EXT = [".jpeg", ".jpg", ".JPG", ".JPEG", ".png", ".webp"], PH = [];
function tryLoad(base, i = 0) { return new Promise(res => { if (i >= EXT.length) return res(null); const im = new Image();
  im.onload = () => res(base + EXT[i]); im.onerror = () => tryLoad(base, i + 1).then(res); im.src = encodeURI(base + EXT[i]); }); }
X.photos.forEach((p, i) => tryLoad(p).then(u => { if (u) { PH[i] = encodeURI(u); $$(`[data-ph="${i}"]`).forEach(el => el.src = PH[i]); } }));

/* ---------- particles ---------- */
const cv = $("#fx"), cx = cv.getContext("2d"); let P = [];
function fit() { const r = app.getBoundingClientRect(), k = devicePixelRatio || 1; cv.width = r.width * k; cv.height = r.height * k; cx.setTransform(k, 0, 0, k, 0, 0); }
fit(); addEventListener("resize", fit);
const CONF = ["#ffb23f", "#3ddc97", "#ff6b8a", "#fff3c4", "#6ec1ff", "#ffffff"];
function burst(x, y, n = 70, cols = CONF, sp = 6) { for (let i = 0; i < n; i++) { const a = Math.random() * 6.28, v = 1 + Math.random() * sp;
  P.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: .05, s: 1.2 + Math.random() * 2.2, c: cols[i % cols.length], l: 1, d: .013 }); } }
function confetti(x, y, n = 120, dir = 0) { for (let i = 0; i < n; i++) { const a = -Math.PI / 2 + dir + (Math.random() - .5) * 1.4, v = 6 + Math.random() * 8;
  P.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: .22, s: 4 + Math.random() * 4, c: CONF[i % 6], l: 1, d: .006, r: Math.random() * 6, vr: (Math.random() - .5) * .4, q: 1, drag: .985 }); } }
(function loop() {
  const W = app.clientWidth, H = app.clientHeight; cx.clearRect(0, 0, W, H);
  P = P.filter(p => p.l > 0 && p.y < H + 40);
  for (const p of P) { if (p.drag) { p.vx *= p.drag; p.vy *= p.drag; } p.vy += p.g; p.x += p.vx; p.y += p.vy; p.l -= p.d;
    cx.globalAlpha = Math.max(0, Math.min(1, p.l)); cx.fillStyle = p.c;
    if (p.q) { p.r += p.vr; cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); cx.restore(); }
    else { cx.beginPath(); cx.arc(p.x, p.y, p.s, 0, 7); cx.fill(); } }
  cx.globalAlpha = 1; requestAnimationFrame(loop);
})();

/* ---------- song ---------- */
let song;
function startSong() { if (!X.song || song) return; song = new Audio(X.song); song.loop = true; song.volume = 0; song.play().catch(() => {});
  let v = 0; const f = setInterval(() => { v = Math.min(.85, v + .05); song.volume = v; if (v >= .85) clearInterval(f); }, 120); }

/* ---------- scenes ---------- */
function show(id) { $$(".sc.on").forEach(s => s.classList.remove("on")); const el = $("#" + id); void el.offsetWidth; el.classList.add("on"); return el; }
const tapOnce = (el, ms) => new Promise(res => { let d = false; const go = () => { if (d) return; d = true; res(); }; el.addEventListener("click", go); setTimeout(go, ms); });

async function track() {
  const route = $("#route"), done = $("#done"), L = route.getTotalLength(), map = $("#map"), truck = $("#truck"), svg = $("#mapSvg");
  const steps = $$("#steps i"); steps[0].className = "done"; steps[1].className = "done"; steps[2].className = "now";
  const stops = [.28, .55, .8], N = Math.min(stops.length, X.photos.length);
  const toPx = len => { const p = route.getPointAtLength(len); return [p.x / 360 * map.clientWidth, p.y / 360 * map.clientHeight]; };
  /* pins */
  const pins = stops.slice(0, N).map(f => { const [x, y] = toPx(L * f); const d = document.createElement("div"); d.className = "pin"; d.textContent = "📍"; d.style.left = x + "px"; d.style.top = y + "px"; map.appendChild(d); return d; });
  { const [x, y] = toPx(L); const h = document.createElement("div"); h.className = "pin"; h.textContent = "🏠"; h.style.left = x + "px"; h.style.top = y + "px"; map.appendChild(h); pins.push(h); }
  done.style.strokeDasharray = `${L}`; done.style.strokeDashoffset = L;
  const place = f => { const [x, y] = toPx(L * f); truck.style.left = x + "px"; truck.style.top = y + "px"; done.style.strokeDashoffset = L * (1 - f); };
  const drive = (a, b, ms) => new Promise(res => { const t0 = performance.now(); (function step(t) { const k = Math.min(1, (t - t0) / ms), e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    place(a + (b - a) * e); if (k < 1) requestAnimationFrame(step); else res(); })(t0); });
  place(0); let cur = 0;
  for (let i = 0; i < N; i++) {
    await drive(cur, stops[i], 2200); cur = stops[i];
    pins[i].classList.add("hit"); burst(...at(pins[i]), 30, CONF, 3);
    $("#stopImg").src = PH[i] || ""; txt("#stopN", X.stopTitles[i] || `STOP ${i + 1}`); txt("#stopP", X.stopLines[i] || "");
    $("#stop").classList.add("on"); await wait(3800); $("#stop").classList.remove("on"); await wait(500);
  }
  txt("#stH", X.arrivingTitle); txt("#eta", "Almost there… 🏠");
  await drive(cur, 1, 2000);
  steps[2].className = "done"; steps[3].className = "done"; txt("#stH", "Arrived! 🎉"); txt("#eta", "Your parcel is at the door");
  burst(...at(pins[pins.length - 1]), 80, CONF, 5);
  await wait(2000);
}

async function door() {
  await tapOnce($("#bell"), 12000);
  $("#bell").classList.add("pressed"); $("#drHint").classList.add("off"); $("#drK").style.opacity = 0; $("#drT").style.opacity = 0; $("#ding").classList.add("on");
  await wait(900); $("#doorway").classList.add("open");
  await wait(1600); const [x, y] = at($("#doorway")); burst(x, y + 60, 80, CONF, 5);
  await wait(1800);
}

async function box() {
  await tapOnce($("#box"), 12000);
  $("#box").classList.add("open"); $("#bxHint").classList.add("off");
  const [x, y] = at($("#box")); confetti(x, y - 40, 170); burst(x, y - 60, 90, CONF, 7);
  await wait(1100); $("#hamper").classList.add("on");
  await wait(5600);
}

async function receipt() {
  confetti(30, app.clientHeight, 90, .45); confetti(app.clientWidth - 30, app.clientHeight, 90, -.45);
  await wait(1400);
  const fs = $("#s-final"), down = () => fs.scrollTo({ top: fs.scrollHeight, behavior: "smooth" });
  for (const p of $$("#note p")) { p.classList.add("s"); down(); await wait(1500); }
  $("#sign").classList.add("s"); down(); await wait(600);
  $$("#stars b").forEach(s => s.onclick = () => {
    const n = +s.dataset.n; $$("#stars b").forEach(b => b.classList.toggle("on", +b.dataset.n <= n)); txt("#rtP", X.rateLines[n]);
    if (n === 5) { const [sx, sy] = at($("#stars")); confetti(sx, sy, 100); }
  });
  const a = $("#again"); a.hidden = false; a.removeAttribute("hidden"); down();
}

let started = false;
$("#s-lock").addEventListener("click", async () => {
  if (started) return; started = true;
  startSong(); $("#lkHint").classList.add("off");
  { const [x, y] = at($(".noti")); burst(x, y, 70, CONF, 5); }
  await wait(700);
  show("s-track"); await wait(900);
  await track();
  show("s-door"); await wait(900);
  await door();
  show("s-box"); await wait(900);
  await box();
  show("s-final");
  await receipt();
});
$("#again").onclick = () => location.reload();
</script>
</body>
</html>
